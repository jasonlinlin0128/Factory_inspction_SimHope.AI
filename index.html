<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- Version: 2025-12-14-Modal-Fix-v2 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廠區設備巡檢儀表板 v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        #modal-body::-webkit-scrollbar { width: 8px; }
        #modal-body::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        #modal-body::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 font-sans">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-slate-800">廠區設備巡檢儀表板</h1>
            <p class="text-slate-500 mt-2">Real-time Monitoring Dashboard</p>
        </header>

        <div class="flex flex-wrap gap-3 items-center mb-6">
            <button onclick="window.location.href='history.html'" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-5 rounded-lg">巡檢歷史</button>
            <button id="export-excel-button" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-5 rounded-lg">匯出 Excel 報表</button>
            <button id="reset-button" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-5 rounded-lg">重置所有狀態</button>
        </div>

        <div id="dashboard-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 mb-8">
            <!-- 巡檢點卡片將動態生成 -->
        </div>

        <!-- 待處理異常回報區（移到儀表板下方） -->
        <section id="abnormal-reports-section" class="mb-8 hidden">
             <h2 class="text-2xl font-bold text-slate-800 mb-4 border-b-2 border-red-500 pb-2 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-red-500 mr-3"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                待處理異常回報
            </h2>
            <div id="abnormal-reports-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 異常回報卡片將動態生成 -->
            </div>
        </section>
    </div>

    <!-- 通用歷史紀錄 Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <header class="flex items-center justify-between p-5 border-b">
                <h2 id="history-modal-title" class="text-xl font-bold">巡檢紀錄</h2>
                <button id="close-modal-button" class="text-slate-400 hover:text-slate-800 text-3xl">&times;</button>
            </header>
            <main id="modal-body" class="p-6 overflow-y-auto space-y-4 bg-slate-50"></main>
        </div>
    </div>

    <!-- 異常處理 Modal -->
    <div id="resolve-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
            <header class="flex items-center justify-between p-5 border-b">
                <h2 class="text-xl font-bold text-slate-800">標記異常已處理</h2>
                <button id="close-resolve-modal" class="text-slate-400 hover:text-slate-800 text-3xl leading-none">&times;</button>
            </header>
            <main class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700">處理人員姓名 *</label>
                    <input type="text" id="resolver-name-input" class="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="請輸入您的姓名">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700">處理說明 *</label>
                    <textarea id="resolution-input" rows="4" class="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="請詳述處理過程和結果"></textarea>
                </div>
            </main>
            <footer class="flex justify-end gap-3 p-5 border-t bg-slate-50 rounded-b-lg">
                <button id="cancel-resolve-button" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-md font-medium transition-colors">取消</button>
                <button id="confirm-resolve-button" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md font-medium transition-colors">確認處理完成</button>
            </footer>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, serverTimestamp, writeBatch, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEtV1Rguj-LzOeLFa-KPUtbAb-9L_bf1E",
            authDomain: "factory-inspection-system.firebaseapp.com",
            projectId: "factory-inspection-system",
            storageBucket: "factory-inspection-system.firebasestorage.app",
            messagingSenderId: "1094359521084",
            appId: "1:1094359521084:web:f24d8dd4fd68c3e670f039",
            measurementId: "G-MJ417JZWR6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const inspectionPoints = [
            { id: 'crane-1', name: '天車-1' }, { id: 'crane-2', name: '天車-2' }, { id: 'crane-3', name: '天車-3' }, { id: 'crane-4', name: '天車-4' }, { id: 'crane-5', name: '天車-5' }, { id: 'hook-safety', name: '吊鉤安全高度' }, { id: 'emergency-stop', name: '急停開關' }, { id: 'acetylene', name: '乙炔存放區' }, { id: 'factory-lights', name: '工廠電燈' }
        ];

        const grid = document.getElementById('dashboard-grid');
        const historyModal = document.getElementById('history-modal');
        const closeModalButton = document.getElementById('close-modal-button');
        const modalBody = document.getElementById('modal-body');
        const modalTitle = document.getElementById('history-modal-title');
        const abnormalSection = document.getElementById('abnormal-reports-section');
        const abnormalGrid = document.getElementById('abnormal-reports-grid');

        let openAbnormalReports = []; // 儲存待處理的異常報告

        function renderDashboard(pointsData) {
            grid.innerHTML = '';
            const dataMap = pointsData.reduce((map, item) => ({...map, [item.id]: item }), {});

            inspectionPoints.forEach(point => {
                const data = dataMap[point.id] || {};
                const hasAbnormalReport = openAbnormalReports.some(report => report.pointId === point.id);
                const status = data.status || 'pending';
                const inspectorName = data.inspectorName || '---';
                let timestamp = '---';
                if (data.timestamp?.toDate) timestamp = data.timestamp.toDate().toLocaleString('zh-TW', { hour12: false });

                // 裝置資訊（詳細版）
                const deviceInfo = data.deviceInfo || null;
                let deviceHTML = '';
                if (deviceInfo) {
                    const deviceIcon = deviceInfo.os === 'Android' ? '📱' : deviceInfo.os === 'iOS' ? '🍎' : '💻';

                    // 組合裝置型號和系統版本
                    let deviceDetail = '';
                    if (deviceInfo.deviceModel) {
                        deviceDetail = deviceInfo.deviceModel;
                        if (deviceInfo.osVersion) deviceDetail += ` (${deviceInfo.os} ${deviceInfo.osVersion})`;
                    } else if (deviceInfo.osVersion) {
                        deviceDetail = `${deviceInfo.os} ${deviceInfo.osVersion}`;
                    } else {
                        deviceDetail = deviceInfo.os;
                    }

                    // 組合瀏覽器和版本
                    let browserDetail = deviceInfo.browser;
                    if (deviceInfo.browserVersion) {
                        const shortVersion = deviceInfo.browserVersion.split('.')[0]; // 只取主版本號
                        browserDetail += ` ${shortVersion}`;
                    }

                    deviceHTML = `<p class="text-xs">裝置: <span class="font-medium text-slate-700">${deviceIcon} ${deviceDetail}</span></p>
                                  <p class="text-xs">瀏覽器: <span class="font-medium text-slate-700">${browserDetail}</span></p>`;
                }

                const isInspected = status === 'inspected';
                const statusBgColor = isInspected ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                const statusText = isInspected ? '已巡檢' : '待巡檢';
                let borderColor = isInspected ? 'border-green-500' : 'border-red-500';
                if(hasAbnormalReport) borderColor = 'border-yellow-500 ring-4 ring-yellow-300'; // **新增**：有異常時顯示黃色外框

                const detailsButtonHTML = `<button data-id="${point.id}" data-name="${point.name}" class="view-details-button mt-4 w-full bg-slate-700 hover:bg-slate-800 text-white text-sm py-2 px-3 rounded-md">查看紀錄</button>`;

                const cardHTML = `
                    <div class="bg-white rounded-lg border-t-4 ${borderColor} shadow-sm p-5 flex flex-col justify-between">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800 mb-3">${point.name}</h2>
                            <div class="flex items-center mb-4">
                                <span class="font-semibold px-3 py-1 rounded-full text-xs ${statusBgColor}">${statusText}</span>
                            </div>
                        </div>
                        <div class="text-sm text-slate-500 space-y-1">
                            <p>巡檢員: <span class="font-medium text-slate-700">${inspectorName}</span></p>
                            <p>時間: <span class="font-medium text-slate-700">${timestamp}</span></p>
                            ${deviceHTML}
                            ${detailsButtonHTML}
                        </div>
                    </div>`;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // **新增**：渲染異常回報卡片
        function renderAbnormalReports(reports) {
            openAbnormalReports = reports; // 更新全域變數
            if (reports.length === 0) {
                abnormalSection.classList.add('hidden');
                return;
            }
            abnormalSection.classList.remove('hidden');
            abnormalGrid.innerHTML = '';
            reports.forEach(report => {
                const formattedTime = report.timestamp.toDate().toLocaleString('zh-TW', { dateStyle: 'short', timeStyle: 'short' });
                const imageHTML = report.imageBase64 ? `<img src="${report.imageBase64}" class="w-full h-auto rounded-md mt-2 border">` : '';

                const reportCard = `
                    <div class="bg-white rounded-lg border-l-4 border-red-500 shadow-md p-4">
                        <div class="mb-2">
                            <h3 class="font-bold text-lg text-red-700">${report.pointName}</h3>
                            <p class="text-sm text-slate-500">${formattedTime}</p>
                        </div>
                        <p class="text-slate-800 bg-slate-100 p-2 rounded-md">${report.description}</p>
                        ${imageHTML}
                        <div class="mt-3 flex justify-between items-center">
                            <span class="text-sm font-semibold">${report.inspectorName} 回報</span>
                            <button
                                data-report-id="${report.id}"
                                data-point-name="${report.pointName}"
                                data-inspector-name="${report.inspectorName}"
                                class="resolve-button bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded-md text-sm font-medium transition-colors">
                                標記已處理
                            </button>
                        </div>
                    </div>
                `;
                abnormalGrid.insertAdjacentHTML('beforeend', reportCard);
            });
        }

        function listenForUpdates() {
            onSnapshot(collection(db, 'inspectionPoints'), (snapshot) => {
                const pointsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderDashboard(pointsData); // 重新渲染主儀表板以更新外框
            });

            // **新增**：監聽異常回報
            const q = query(collection(db, 'abnormal_reports'), where("status", "==", "reported"));
            onSnapshot(q, (snapshot) => {
                const reports = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                reports.sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis());
                renderAbnormalReports(reports);
            });
        }

        async function resetAllStatus() { 
            if (!confirm('您確定要重置所有巡檢點的狀態嗎？此操作無法復原。')) return;
            try {
                const batch = writeBatch(db);
                inspectionPoints.forEach(point => {
                    const pointRef = doc(db, 'inspectionPoints', point.id);
                    batch.set(pointRef, { name: point.name, status: 'pending', inspectorName: null, timestamp: null });
                });
                await batch.commit();
                alert('所有巡檢點狀態已成功重置！');
            } catch (error) {
                console.error("重置狀態時發生錯誤: ", error);
                alert('重置失敗，請檢查控制台錯誤訊息。');
            }
         }
        async function openHistoryModal(pointId, pointName) { 
            modalTitle.textContent = `${pointName} - 7 日巡檢紀錄`;
            historyModal.classList.remove('hidden');
            modalBody.innerHTML = '<p class="text-slate-500 text-center">正在載入紀錄...</p>';
            const logCollectionName = pointId === 'acetylene' ? 'acetylene_log' : 'standard_inspection_log';
            const logCollectionRef = collection(db, logCollectionName);
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            let q = pointId === 'acetylene'
                ? query(logCollectionRef, where("timestamp", ">=", sevenDaysAgo))
                : query(logCollectionRef, where("pointId", "==", pointId), where("timestamp", ">=", sevenDaysAgo));
            try {
                const querySnapshot = await getDocs(q);
                let logs = querySnapshot.docs.map(doc => doc.data()).filter(log => log.timestamp);
                logs.sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis());
                if (logs.length === 0) {
                    modalBody.innerHTML = '<p class="text-slate-500 text-center">最近 7 日無巡檢紀錄。</p>';
                    return;
                }
                modalBody.innerHTML = '';
                logs.forEach(log => {
                    const formattedTime = log.timestamp.toDate().toLocaleString('zh-TW', { dateStyle: 'short', timeStyle: 'short', hour12: false });
                    const imageHTML = log.imageBase64 ? `<img src="${log.imageBase64}" alt="巡檢照片" class="w-full h-auto rounded-md mt-2 border border-slate-200">` : '';
                    const logElement = document.createElement('div');
                    logElement.className = 'border border-slate-200 p-4 rounded-lg bg-white';
                    logElement.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <p class="font-bold text-lg text-slate-800">${log.inspectorName}</p>
                            <p class="text-sm text-slate-500">${formattedTime}</p>
                        </div>
                        ${imageHTML}
                    `;
                    modalBody.appendChild(logElement);
                });
            } catch (error) {
                console.error("讀取歷史紀錄失敗:", error);
                modalBody.innerHTML = `<p class="text-red-500 text-center">讀取紀錄失敗: ${error.message}</p>`;
            }
         }
        function closeModal() { 
            historyModal.classList.add('hidden');
         }

        document.getElementById('reset-button').addEventListener('click', resetAllStatus);
        closeModalButton.addEventListener('click', closeModal);
        historyModal.addEventListener('click', (e) => { if (e.target === historyModal) closeModal(); });

        listenForUpdates();

        // ========== 異常處理功能 ==========

        // Modal 元素
        const resolveModal = document.getElementById('resolve-modal');
        const closeResolveModalBtn = document.getElementById('close-resolve-modal');
        const cancelResolveButton = document.getElementById('cancel-resolve-button');
        const confirmResolveButton = document.getElementById('confirm-resolve-button');
        const resolverNameInput = document.getElementById('resolver-name-input');
        const resolutionInput = document.getElementById('resolution-input');

        let currentReportId = null;

        // 開啟處理對話框
        function openResolveModal(reportId, pointName, inspectorName) {
            currentReportId = reportId;
            resolveModal.classList.remove('hidden');
            resolverNameInput.value = '';
            resolutionInput.value = '';
            resolverNameInput.focus();
        }

        // 關閉對話框
        function closeResolveModalHandler() {
            resolveModal.classList.add('hidden');
            currentReportId = null;
        }

        // 確認處理
        async function confirmResolve() {
            const resolverName = resolverNameInput.value.trim();
            const resolution = resolutionInput.value.trim();

            if (!resolverName || !resolution) {
                alert('請填寫所有必填欄位！');
                return;
            }

            try {
                confirmResolveButton.disabled = true;
                confirmResolveButton.textContent = '處理中...';

                await updateDoc(doc(db, 'abnormal_reports', currentReportId), {
                    status: 'resolved',
                    resolvedBy: resolverName,
                    resolvedAt: serverTimestamp(),
                    resolution: resolution
                });

                alert('異常已標記為處理完成！LINE 通知已自動發送。');
                closeResolveModalHandler();
            } catch (error) {
                console.error('處理失敗:', error);
                alert('處理失敗: ' + error.message);
            } finally {
                confirmResolveButton.disabled = false;
                confirmResolveButton.textContent = '確認處理完成';
            }
        }

        // 綁定事件：點擊「標記已處理」按鈕
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('resolve-button')) {
                const reportId = e.target.dataset.reportId;
                const pointName = e.target.dataset.pointName;
                const inspectorName = e.target.dataset.inspectorName;
                openResolveModal(reportId, pointName, inspectorName);
            }
        });

        // 綁定事件：點擊「查看紀錄」按鈕 (使用事件委託以支援動態生成的元素)
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('view-details-button')) {
                const pointId = e.target.dataset.id;
                const pointName = e.target.dataset.name;
                openHistoryModal(pointId, pointName);
            }
        });

        // 綁定 Modal 關閉事件
        closeResolveModalBtn.addEventListener('click', closeResolveModalHandler);
        cancelResolveButton.addEventListener('click', closeResolveModalHandler);
        confirmResolveButton.addEventListener('click', confirmResolve);
        resolveModal.addEventListener('click', (e) => {
            if (e.target === resolveModal) closeResolveModalHandler();
        });

        // Excel 匯出功能
        async function exportToExcel() {
            try {
                const exportButton = document.getElementById('export-excel-button');
                exportButton.disabled = true;
                exportButton.textContent = '正在匯出...';

                // 收集巡檢記錄
                const inspectionData = [];
                const sevenDaysAgo = new Date();
                sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

                const standardQuery = query(collection(db, 'standard_inspection_log'));
                const standardSnapshot = await getDocs(standardQuery);

                const pointsMap = {
                    'crane-1': '天車-1', 'crane-2': '天車-2', 'crane-3': '天車-3',
                    'crane-4': '天車-4', 'crane-5': '天車-5',
                    'acetylene': '乙炔區',
                    'air-compressor': '空壓機',
                    'hook-safety': '吊鉤安全高度',
                    'emergency-stop': '急停開關',
                    'factory-lights': '工廠電燈'
                };

                standardSnapshot.docs.forEach(doc => {
                    const data = doc.data();
                    if (data.timestamp) {
                        const deviceInfo = data.deviceInfo || {};
                        let deviceDetail = deviceInfo.os || '---';
                        if (deviceInfo.deviceModel) {
                            deviceDetail = `${deviceInfo.deviceModel} (${deviceInfo.os || ''} ${deviceInfo.osVersion || ''})`.trim();
                        } else if (deviceInfo.osVersion) {
                            deviceDetail = `${deviceInfo.os} ${deviceInfo.osVersion}`;
                        }

                        let browserDetail = deviceInfo.browser || '---';
                        if (deviceInfo.browserVersion) {
                            browserDetail = `${deviceInfo.browser} ${deviceInfo.browserVersion.split('.')[0]}`;
                        }

                        inspectionData.push({
                            '巡檢點': pointsMap[data.pointId] || data.pointId,
                            '巡檢員': data.inspectorName || '',
                            '時間': data.timestamp.toDate().toLocaleString('zh-TW', { hour12: false }),
                            '裝置': deviceDetail,
                            '瀏覽器': browserDetail
                        });
                    }
                });

                // 收集異常回報
                const abnormalData = [];
                const abnormalQuery = query(collection(db, 'abnormal_reports'));
                const abnormalSnapshot = await getDocs(abnormalQuery);

                abnormalSnapshot.docs.forEach(doc => {
                    const data = doc.data();
                    const deviceInfo = data.deviceInfo || {};
                    let deviceDetail = deviceInfo.os || '---';
                    if (deviceInfo.deviceModel) {
                        deviceDetail = `${deviceInfo.deviceModel} (${deviceInfo.os || ''} ${deviceInfo.osVersion || ''})`.trim();
                    } else if (deviceInfo.osVersion) {
                        deviceDetail = `${deviceInfo.os} ${deviceInfo.osVersion}`;
                    }

                    let browserDetail = deviceInfo.browser || '---';
                    if (deviceInfo.browserVersion) {
                        browserDetail = `${deviceInfo.browser} ${deviceInfo.browserVersion.split('.')[0]}`;
                    }

                    abnormalData.push({
                        '巡檢點': data.pointName || '',
                        '回報人': data.inspectorName || '',
                        '回報時間': data.timestamp?.toDate().toLocaleString('zh-TW', { hour12: false }) || '',
                        '狀況描述': data.description || '',
                        '狀態': data.status === 'resolved' ? '已處理' : '處理中',
                        '處理人': data.resolvedBy || '---',
                        '處理時間': data.resolvedAt?.toDate().toLocaleString('zh-TW', { hour12: false }) || '---',
                        '處理說明': data.resolution || '---',
                        '裝置': deviceDetail,
                        '瀏覽器': browserDetail
                    });
                });

                // 建立工作簿
                const wb = XLSX.utils.book_new();

                // 建立巡檢記錄工作表
                const ws1 = XLSX.utils.json_to_sheet(inspectionData);
                XLSX.utils.book_append_sheet(wb, ws1, '巡檢記錄');

                // 建立異常回報工作表
                const ws2 = XLSX.utils.json_to_sheet(abnormalData);
                XLSX.utils.book_append_sheet(wb, ws2, '異常回報');

                // 匯出檔案
                const timestamp = new Date().toISOString().slice(0, 10);
                XLSX.writeFile(wb, `工廠巡檢報表_${timestamp}.xlsx`);

                exportButton.disabled = false;
                exportButton.textContent = '匯出 Excel 報表';
                alert('Excel 報表匯出成功！');

            } catch (error) {
                console.error('匯出失敗:', error);
                alert('匯出失敗: ' + error.message);
                const exportButton = document.getElementById('export-excel-button');
                exportButton.disabled = false;
                exportButton.textContent = '匯出 Excel 報表';
            }
        }

        // 綁定匯出按鈕
        document.getElementById('export-excel-button').addEventListener('click', exportToExcel);
    </script>

</body>
</html>
