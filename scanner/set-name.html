<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>首次巡檢簽名</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen p-4">

    <div class="w-full max-w-sm mx-auto">
        <div class="bg-white p-8 rounded-lg border border-slate-200 shadow-sm text-center">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">首次巡檢簽名</h1>
            <p class="text-slate-500 mb-6">請輸入您的姓名或工號，系統將會記住您的設定。</p>
            
            <input type="text" id="inspector-name-input" class="w-full text-center bg-slate-50 p-3 rounded-md border border-slate-300 focus:ring-2 focus:ring-slate-500 focus:outline-none text-lg" placeholder="例如：王大明">
            
            <button id="save-name-button" class="w-full mt-4 bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-md transition-colors duration-200 transform active:scale-95">
                儲存並開始巡檢
            </button>

            <p id="status-message" class="text-center mt-2 h-5"></p>
        </div>

        <!-- 生物辨識設定區 -->
        <div id="biometric-section" class="hidden bg-white p-8 rounded-lg border border-blue-200 shadow-sm mt-4">
            <h3 class="text-lg font-bold mb-2 text-blue-800 text-center">設定生物辨識驗證</h3>
            <p class="text-sm text-slate-600 mb-4 text-center">
                使用 Face ID 或 Touch ID 可以讓每次巡檢時更快速、更安全地驗證身份。
            </p>
            <div class="flex gap-3">
                <button type="button" id="skip-biometric" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2 px-4 rounded-lg">
                    暫不設定
                </button>
                <button type="button" id="register-biometric" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">
                    設定生物辨識
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { isPlatformAuthenticatorAvailable, registerWebAuthn } from './webauthn-utils.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBEtV1Rguj-LzOeLFa-KPUtbAb-9L_bf1E",
            authDomain: "factory-inspection-system.firebaseapp.com",
            projectId: "factory-inspection-system",
            storageBucket: "factory-inspection-system.firebasestorage.app",
            messagingSenderId: "1094359521084",
            appId: "1:1094359521084:web:f24d8dd4fd68c3e670f039"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        await signInAnonymously(auth);

        const nameInput = document.getElementById('inspector-name-input');
        const saveButton = document.getElementById('save-name-button');
        const statusMessage = document.getElementById('status-message');
        const biometricSection = document.getElementById('biometric-section');
        const skipBiometricButton = document.getElementById('skip-biometric');
        const registerBiometricButton = document.getElementById('register-biometric');

        let currentName = '';

        // 獲取設定完成後要跳轉回去的網址
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirectUrl');

        // 第一步：儲存姓名
        async function saveNameAndCheckBiometric() {
            currentName = nameInput.value.trim();

            if (!currentName) {
                statusMessage.textContent = '請輸入姓名';
                statusMessage.className = 'text-center mt-2 h-5 text-red-500';
                return;
            }

            localStorage.setItem('inspectorName', currentName);

            // 檢查是否支援生物辨識
            const supported = await isPlatformAuthenticatorAvailable();

            if (supported) {
                // 顯示生物辨識註冊選項
                nameInput.disabled = true;
                saveButton.classList.add('hidden');
                biometricSection.classList.remove('hidden');
                statusMessage.textContent = '✓ 姓名已儲存！是否要設定生物辨識驗證？';
                statusMessage.className = 'text-center mt-2 h-5 text-green-500';
            } else {
                // 直接完成設定
                redirectBack();
            }
        }

        // 跳過生物辨識
        skipBiometricButton.addEventListener('click', () => {
            localStorage.setItem('webauthn_skipped', 'true');
            redirectBack();
        });

        // 註冊生物辨識
        registerBiometricButton.addEventListener('click', async () => {
            try {
                registerBiometricButton.disabled = true;
                registerBiometricButton.textContent = '正在設定...';
                statusMessage.textContent = '請使用 Face ID 或 Touch ID 進行驗證...';
                statusMessage.className = 'text-center mt-2 h-5 text-blue-500';

                await registerWebAuthn(currentName, db);

                statusMessage.textContent = '✓ 生物辨識設定完成！';
                statusMessage.className = 'text-center mt-2 h-5 text-green-500';

                setTimeout(redirectBack, 1500);

            } catch (error) {
                console.error('註冊失敗:', error);
                statusMessage.textContent = `設定失敗: ${error.message}`;
                statusMessage.className = 'text-center mt-2 h-5 text-red-500';
                registerBiometricButton.disabled = false;
                registerBiometricButton.textContent = '重試設定';
            }
        });

        function redirectBack() {
            if (redirectUrl) {
                window.location.href = redirectUrl;
            } else {
                alert('設定成功！');
                window.location.href = '../index.html';
            }
        }

        saveButton.addEventListener('click', saveNameAndCheckBiometric);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveNameAndCheckBiometric();
            }
        });
    </script>
</body>
</html>
