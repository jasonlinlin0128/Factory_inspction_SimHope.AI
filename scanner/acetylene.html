<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>乙炔區拍照巡檢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        body::-webkit-scrollbar { width: 8px; }
        body::-webkit-scrollbar-track { background: #f1f5f9; }
        body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <div class="container mx-auto p-4 max-w-lg">
        <header class="text-center mb-6 pt-4 flex-shrink-0">
            <h1 class="text-2xl font-bold text-slate-900">乙炔存放區巡檢</h1>
            <p class="text-slate-500">巡檢員: <span id="display-inspector-name" class="font-semibold text-blue-600"></span></p>
        </header>

        <!-- 1. 拍照上傳區 -->
        <section class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm mb-6 flex-shrink-0">
            <h2 class="text-lg font-semibold mb-2 text-slate-800">1. 拍照確認閥門</h2>
            <p class="text-sm text-slate-500 mb-5">請使用相機拍攝閥門已確實關閉的照片。</p>
            <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden">
            <button id="take-photo-button" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-md transition-colors">啟動相機拍照</button>
            <img id="photo-preview" class="hidden w-full rounded-md my-4 border border-slate-200" alt="照片預覽">
            <button id="upload-button" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md hidden" disabled>上傳並完成巡檢</button>
            <div id="upload-status" class="mt-4 text-center h-6"></div>
        </section>

        <!-- 2. 七日內巡檢紀錄 -->
        <section class="bg-white border border-slate-200 rounded-lg shadow-sm min-h-0 mb-6">
             <h2 class="text-lg font-semibold text-slate-800 p-5">2. 最近 7 日巡檢紀錄</h2>
            <div id="history-log" class="space-y-4 p-5 pt-0">
                <p class="text-slate-400 text-center">正在載入紀錄...</p>
            </div>
        </section>
        
        <!-- 3. 異常回報區 -->
        <section id="abnormal-report-section" class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm mb-6 flex-shrink-0">
            <h2 class="text-lg font-semibold mb-2 text-slate-800">3. 回報異常狀況 (選填)</h2>
             <textarea id="report-description" class="w-full mt-3 bg-slate-50 p-2 rounded-md border border-slate-300 focus:ring-2 focus:ring-yellow-500 focus:outline-none" rows="3" placeholder="若有異常，請在此描述..."></textarea>
            <input type="file" id="report-photo" accept="image/*,video/*" capture="environment" class="hidden">
            <button id="report-photo-button" class="w-full mt-3 bg-slate-700 hover:bg-slate-800 text-white py-2 px-3 rounded-md transition-colors">拍攝照片/影片存證</button>
            <img id="report-photo-preview" class="hidden w-full rounded-md my-3 border border-slate-200">
            <button id="submit-report-button" class="w-full mt-3 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 rounded-md transition-colors">提交異常回報</button>
            <p id="report-status" class="text-center mt-2 h-5"></p>
        </section>

        <!-- 4. 我的回報 -->
        <section class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm mb-6 flex-shrink-0">
            <h2 class="text-lg font-semibold mb-2 text-slate-800">4. 我的回報</h2>
            <button id="my-reports-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition-colors">查看我的異常回報</button>
        </section>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, updateDoc, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEtV1Rguj-LzOeLFa-KPUtbAb-9L_bf1E",
            authDomain: "factory-inspection-system.firebaseapp.com",
            projectId: "factory-inspection-system",
            storageBucket: "factory-inspection-system.firebasestorage.app",
            messagingSenderId: "1094359521084",
            appId: "1:1094359521084:web:f24d8dd4fd68c3e670f039",
            measurementId: "G-MJ417JZWR6"
        };
        
        const displayName = document.getElementById('display-inspector-name');
        const photoInput = document.getElementById('photo-input');
        const takePhotoButton = document.getElementById('take-photo-button');
        const photoPreview = document.getElementById('photo-preview');
        const uploadButton = document.getElementById('upload-button');
        const uploadStatus = document.getElementById('upload-status');
        const historyLog = document.getElementById('history-log');
        const reportDescription = document.getElementById('report-description');
        const reportPhotoInput = document.getElementById('report-photo');
        const reportPhotoButton = document.getElementById('report-photo-button');
        const reportPhotoPreview = document.getElementById('report-photo-preview');
        const submitReportButton = document.getElementById('submit-report-button');
        const reportStatus = document.getElementById('report-status');

        let db, auth, inspectorName, compressedPhotoBase64 = null, compressedReportPhotoBase64 = null;

        // 獲取裝置資訊（詳細版）
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = 'Unknown';
            let browserVersion = '';
            let os = 'Unknown';
            let osVersion = '';
            let deviceModel = '';

            // 偵測瀏覽器和版本
            if (ua.indexOf('Edg') > -1) {
                browser = 'Edge';
                const match = ua.match(/Edg\/([0-9.]+)/);
                if (match) browserVersion = match[1];
            } else if (ua.indexOf('Chrome') > -1) {
                browser = 'Chrome';
                const match = ua.match(/Chrome\/([0-9.]+)/);
                if (match) browserVersion = match[1];
            } else if (ua.indexOf('Safari') > -1) {
                browser = 'Safari';
                const match = ua.match(/Version\/([0-9.]+)/);
                if (match) browserVersion = match[1];
            } else if (ua.indexOf('Firefox') > -1) {
                browser = 'Firefox';
                const match = ua.match(/Firefox\/([0-9.]+)/);
                if (match) browserVersion = match[1];
            }

            // 偵測作業系統、版本和裝置型號
            if (ua.indexOf('iPhone') > -1) {
                os = 'iOS';
                deviceModel = 'iPhone';
                const match = ua.match(/OS ([0-9_]+)/);
                if (match) osVersion = match[1].replace(/_/g, '.');
            } else if (ua.indexOf('iPad') > -1) {
                os = 'iOS';
                deviceModel = 'iPad';
                const match = ua.match(/OS ([0-9_]+)/);
                if (match) osVersion = match[1].replace(/_/g, '.');
            } else if (ua.indexOf('Android') > -1) {
                os = 'Android';
                const match = ua.match(/Android ([0-9.]+)/);
                if (match) osVersion = match[1];
                // 嘗試解析裝置型號
                const modelMatch = ua.match(/\(Linux; Android [^;]+; ([^)]+)\)/);
                if (modelMatch) deviceModel = modelMatch[1];
            } else if (ua.indexOf('Windows') > -1) {
                os = 'Windows';
                if (ua.indexOf('Windows NT 10.0') > -1) osVersion = '10/11';
                else if (ua.indexOf('Windows NT 6.3') > -1) osVersion = '8.1';
                else if (ua.indexOf('Windows NT 6.2') > -1) osVersion = '8';
                else if (ua.indexOf('Windows NT 6.1') > -1) osVersion = '7';
            } else if (ua.indexOf('Mac') > -1 && ua.indexOf('iPhone') === -1 && ua.indexOf('iPad') === -1) {
                os = 'macOS';
                const match = ua.match(/Mac OS X ([0-9_]+)/);
                if (match) osVersion = match[1].replace(/_/g, '.');
            } else if (ua.indexOf('Linux') > -1) {
                os = 'Linux';
            }

            return {
                browser: browser,
                browserVersion: browserVersion,
                os: os,
                osVersion: osVersion,
                deviceModel: deviceModel,
                userAgent: ua,
                timestamp: new Date().toISOString()
            };
        }

        async function main() {
            inspectorName = localStorage.getItem('inspectorName');
            if (!inspectorName) {
                // **已修正**：構造相對返回路徑，避免 blob URL 問題
                const returnTo = `acetylene.html${window.location.search}`;
                window.location.href = `set-name.html?redirectUrl=${encodeURIComponent(returnTo)}`;
                return;
            }
            displayName.textContent = inspectorName;

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);
            } catch (error) { alert(`Firebase 連線失敗: ${error.message}`); return; }

            bindEvents();
            loadHistory();
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        function bindEvents() {
            takePhotoButton.onclick = () => photoInput.click();
            photoInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    photoPreview.src = URL.createObjectURL(file);
                    photoPreview.classList.remove('hidden');
                    compressedPhotoBase64 = await compressImage(file);
                    uploadButton.classList.remove('hidden');
                    uploadButton.disabled = false;
                    takePhotoButton.textContent = '重新拍照';
                }
            };
            uploadButton.onclick = handleUpload;

            reportPhotoButton.onclick = () => reportPhotoInput.click();
            reportPhotoInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    reportPhotoPreview.src = URL.createObjectURL(file);
                    reportPhotoPreview.classList.remove('hidden');
                    compressedReportPhotoBase64 = await compressImage(file);
                }
            };
            submitReportButton.onclick = submitAbnormalReport;
        }

        async function handleUpload() {
            if (!compressedPhotoBase64) return;
            uploadButton.disabled = true;
            uploadStatus.textContent = '正在上傳紀錄...';
            const deviceInfo = getDeviceInfo();
            try {
                await addDoc(collection(db, 'acetylene_log'), {
                    inspectorName,
                    imageBase64: compressedPhotoBase64,
                    timestamp: serverTimestamp(),
                    deviceInfo: deviceInfo
                });
                await updateDoc(doc(db, 'inspectionPoints', 'acetylene'), {
                    status: 'inspected',
                    inspectorName,
                    timestamp: serverTimestamp(),
                    deviceInfo: deviceInfo
                });
                uploadStatus.textContent = '巡檢成功！';
                uploadStatus.className = 'mt-4 text-center h-6 text-green-600';
                loadHistory();
            } catch (error) {
                uploadStatus.textContent = `上傳失敗: ${error.message}`;
                uploadButton.disabled = false;
            }
        }
        
        async function submitAbnormalReport() {
            const description = reportDescription.value;
            if (!description) {
                alert('請填寫狀況描述！');
                return;
            }
            reportStatus.textContent = '正在提交回報...';
            const deviceInfo = getDeviceInfo();
            try {
                await addDoc(collection(db, 'abnormal_reports'), {
                    pointId: 'acetylene',
                    pointName: '乙炔區',
                    inspectorName,
                    description,
                    imageBase64: compressedReportPhotoBase64,
                    timestamp: serverTimestamp(),
                    status: 'reported',
                    resolvedBy: null,
                    resolvedAt: null,
                    resolution: null,
                    notificationSent: false,
                    resolutionNotificationSent: false,
                    deviceInfo: deviceInfo
                });
                reportStatus.textContent = '異常回報成功！';
                reportStatus.className = 'text-center mt-2 h-5 text-green-600';
                reportDescription.value = '';
                reportPhotoPreview.classList.add('hidden');
                compressedReportPhotoBase64 = null;
            } catch (error) {
                reportStatus.textContent = `提交失敗: ${error.message}`;
            }
        }

        async function loadHistory() {
            historyLog.innerHTML = '<p class="text-slate-400 text-center pt-10">正在載入紀錄...</p>';
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            const q = query(collection(db, 'acetylene_log'), where("timestamp", ">=", sevenDaysAgo));
            try {
                const querySnapshot = await getDocs(q);
                let logs = querySnapshot.docs.map(doc => doc.data()).filter(log => log.timestamp);
                logs.sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis());
                if (logs.length === 0) {
                    historyLog.innerHTML = '<p class="text-slate-400 text-center pt-10">最近 7 日無巡檢紀錄。</p>';
                    return;
                }
                historyLog.innerHTML = '';
                logs.forEach(log => {
                    const formattedTime = log.timestamp.toDate().toLocaleString('zh-TW', { dateStyle: 'short', timeStyle: 'short', hour12: false });
                    const logElement = document.createElement('div');
                    logElement.className = 'bg-slate-50 p-3 rounded-lg border border-slate-200';
                    logElement.innerHTML = `
                        <div class="flex justify-between items-center text-sm mb-2">
                            <p class="font-semibold text-slate-700">${log.inspectorName}</p>
                            <p class="text-slate-500">${formattedTime}</p>
                        </div>
                        <img src="${log.imageBase64}" alt="巡檢照片" class="w-full h-auto rounded-md border border-slate-200">
                    `;
                    historyLog.appendChild(logElement);
                });
            } catch (error) {
                historyLog.innerHTML = `<p class="text-red-500 text-center pt-10">讀取紀錄失敗: ${error.message}</p>`;
            }
        }

        async function openMyReportsModal() {
            const modal = document.getElementById('my-reports-modal');
            const body = document.getElementById('my-reports-body');

            modal.classList.remove('hidden');
            body.innerHTML = '<p class="text-slate-500 text-center py-10">正在載入...</p>';

            try {
                const q = query(
                    collection(db, 'abnormal_reports'),
                    where('inspectorName', '==', inspectorName)
                );
                const snapshot = await getDocs(q);

                let reports = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                reports.sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis());

                if (reports.length === 0) {
                    body.innerHTML = '<p class="text-slate-500 text-center py-10">您尚未回報任何異常。</p>';
                    return;
                }

                body.innerHTML = '';
                reports.forEach(report => {
                    const isResolved = report.status === 'resolved';
                    const statusBadge = isResolved
                        ? '<span class="bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-medium">已處理</span>'
                        : '<span class="bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs font-medium">處理中</span>';

                    const resolutionHTML = isResolved ? `
                        <div class="mt-3 p-3 bg-green-50 rounded-md border border-green-200">
                            <p class="text-sm font-semibold text-green-800">處理說明：</p>
                            <p class="text-sm text-slate-700 mt-1">${report.resolution}</p>
                            <p class="text-xs text-slate-500 mt-2">處理人：${report.resolvedBy} | ${report.resolvedAt.toDate().toLocaleString('zh-TW', { hour12: false })}</p>
                        </div>
                    ` : '';

                    const imageHTML = report.imageBase64 ? `<img src="${report.imageBase64}" class="w-full rounded-md mt-2 border border-slate-200">` : '';

                    const card = `
                        <div class="border border-slate-200 p-4 rounded-lg bg-white">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg text-slate-800">${report.pointName}</h3>
                                ${statusBadge}
                            </div>
                            <p class="text-sm text-slate-500 mb-2">${report.timestamp.toDate().toLocaleString('zh-TW', { hour12: false })}</p>
                            <p class="text-slate-800 bg-slate-100 p-2 rounded-md">${report.description}</p>
                            ${imageHTML}
                            ${resolutionHTML}
                        </div>
                    `;
                    body.insertAdjacentHTML('beforeend', card);
                });

            } catch (error) {
                console.error('載入失敗:', error);
                body.innerHTML = `<p class="text-red-500 text-center py-10">載入失敗: ${error.message}</p>`;
            }
        }

        // 綁定「我的回報」按鈕事件
        document.getElementById('my-reports-button').addEventListener('click', openMyReportsModal);

        // 綁定「我的回報」Modal 關閉事件
        const myReportsModal = document.getElementById('my-reports-modal');
        const closeMyReportsModalBtn = document.getElementById('close-my-reports-modal');
        if (closeMyReportsModalBtn) {
            closeMyReportsModalBtn.addEventListener('click', () => {
                myReportsModal.classList.add('hidden');
            });
        }

        main();
    </script>

    <!-- 我的回報 Modal -->
    <div id="my-reports-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <header class="flex items-center justify-between p-5 border-b bg-white rounded-t-lg">
                <h2 class="text-xl font-bold text-slate-800">我的異常回報</h2>
                <button id="close-my-reports-modal" class="text-slate-400 hover:text-slate-800 text-3xl leading-none">&times;</button>
            </header>
            <main id="my-reports-body" class="p-6 overflow-y-auto space-y-4 bg-slate-50 flex-1"></main>
        </div>
    </div>

</body>
</html>
